version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: storage
    restart: always
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  userinfo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: userinfoservice
    depends_on:
      - mongo
    env_file:
      - .env
    ports:
      - "50051:50051"
    volumes:
      - ./logs:/app/logs

  promtail-userinfo:
    image: grafana/promtail:2.8.2
    container_name: promtail-userinfo
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./config/promtail-config.yml:/etc/promtail/config.yml
    command:
      - "-config.file=/etc/promtail/config.yml"
    ports:
      - "9080:9080"


volumes:
  mongo_data: